title = "Custom Gitleaks Config for CampusQuickBite"

[allowlist]
description = "Allowlist for example files"
paths = [
    '''\.env\.example''',
    '''README\.md''',
    '''.*\.sample$'''
]

[[rules]]
description = "Supabase Anon/Service Role Key"
id = "supabase-key"
regex = '''(?i)(supabase[_-]?(key|secret|anon|service_role)?\s*[:=]\s*["']?eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}["']?)'''
tags = ["key", "Supabase"]

[[rules]]
description = "JWT Secret"
id = "jwt-secret"
regex = '''(?i)(jwt[_-]?(secret|key|token)?\s*[:=]\s*["']?[A-Za-z0-9_!@#$%^&*-]{16,}["']?)'''
tags = ["secret", "JWT"]

[[rules]]
description = "Generic Database Connection String"
id = "db-connection-string"
regex = '''(?i)(postgres(ql)?|mysql|mongodb|redis)(://[a-zA-Z0-9_-]+:([^@\s]+)@[a-zA-Z0-9_.-]+:[0-9]{2,5}/[a-zA-Z0-9_]+)'''
secretGroup = 4
tags = ["secret", "Database"]

[[rules]]
description = "Firebase Web API Key"
id = "firebase-web-api-key"
regex = '''(?i)(ai[a-z0-9_\\-]{37})'''
tags = ["key", "Firebase"]

[[rules]]
description = "Generic Secret Key Assignment"
id = "generic-secret-assignment"
regex = '''(?i)(secret|token|password|passwd|api_key|apikey|private_key|auth_token)\s*[:=]\s*["']?([A-Za-z0-9_!@#$%^&*-]{16,})["']?'''
secretGroup = 2
tags = ["secret", "Generic"]

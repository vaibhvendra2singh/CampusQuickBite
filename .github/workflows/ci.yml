name: CampusBite CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ─── Backend ────────────────────────────────────────────────────────────────
  backend-lint-and-test:
    name: Backend — TypeScript Build + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: TypeScript Compile Check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run Backend Unit Tests
        working-directory: backend
        env:
          # We use mock values so tests don't need a real database
          JWT_SECRET: ci-test-jwt-secret-32chars-minimum
          NODE_ENV: test
        run: npm test -- --passWithNoTests

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — TypeScript Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript + Vite Build
        working-directory: frontend
        run: npm run build

  # ─── E2E (Only on push to main to save CI minutes) ───────────────────────
  e2e-smoke:
    name: E2E — Playwright Smoke Tests
    needs: [backend-lint-and-test, frontend-build]
    runs-on: ubuntu-latest
    # Skip E2E on PRs to keep CI fast (only run on direct pushes)
    if: github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E Smoke Tests
        working-directory: frontend
        run: npx playwright test --reporter=list
        continue-on-error: true  # Don't block deploys on E2E flakiness
